name: Build and Release TaxiPro App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare app bundle
        run: |
          mkdir -p dist/TaxiPro
          cp index.html manifest.json service-worker.js dist/TaxiPro/
          cd dist && zip -r TaxiPro_Release.zip TaxiPro

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: TaxiPro Manager v1.0.0
          body: |
            Αυτόματο πακέτο εφαρμογής **TaxiPro Manager** (PWA) έτοιμο για λήψη και χρήση.
          files: dist/TaxiPro_Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
